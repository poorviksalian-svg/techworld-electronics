<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWorld - Products</title>
    <style>
        :root { --dark-blue: #0A2647; --tech-blue: #00B4D8; --white: #FFFFFF; }
        body { background-color: var(--white); color: var(--dark-blue); font-family: sans-serif; margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 6%; background-color: var(--dark-blue); color: var(--white); }
        header .logo { font-size: 26px; font-weight: 800; color: var(--tech-blue); text-decoration: none; }
        header nav a { margin-left: 25px; text-decoration: none; color: var(--white); font-weight: bold; }
        .container { padding: 40px; text-align: center; }
        .card { background-color: #F4F7FA; padding: 25px; border: 1px solid #E2E8F0; border-radius: 10px; max-width: 300px; margin: 20px auto; }
        .price { color: var(--tech-blue); font-weight: bold; font-size: 22px; }
        .btn { background-color: var(--tech-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">💻 TECHWORLD</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>
    <div class="container">
        <h2>Trending Devices</h2>
        <div class="card">
            <h3>Flagship Smartphone 5G</h3>
            <p>Brand: Samsung Galaxy</p>
            <div class="price">₹79,999</div>
            <a href="cart.html" class="btn">Add To Cart</a>
        </div>
    </div>
</body>
</html>
