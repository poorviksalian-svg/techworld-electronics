<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWorld - Cart</title>
    <style>
        :root { --dark-blue: #0A2647; --tech-blue: #00B4D8; --white: #FFFFFF; }
        body { background-color: var(--white); color: var(--dark-blue); font-family: sans-serif; margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 6%; background-color: var(--dark-blue); color: var(--white); }
        header .logo { font-size: 26px; font-weight: 800; color: var(--tech-blue); text-decoration: none; }
        header nav a { margin-left: 25px; text-decoration: none; color: var(--white); font-weight: bold; }
        .container { padding: 40px; }
        .card { background: white; padding: 30px; border: 1px solid #E2E8F0; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
        .btn { background-color: var(--tech-blue); color: white; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">💻 TECHWORLD</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h2 style="text-align: center;">Your Shopping Cart</h2>
            <div class="item"><span>Flagship Smartphone 5G (x1)</span><strong>₹79,999</strong></div>
            <div class="item" style="font-size: 20px; font-weight: bold; margin-top: 10px;"><span>Total:</span><span style="color: var(--tech-blue);">₹79,999</span></div>
            <button class="btn" onclick="alert('Order Placed Successfully! Your items are on the way.')">Checkout & Place Order</button>
        </div>
    </div>
</body>
</html>
